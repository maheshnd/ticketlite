# The Pulumi project for TicketLite's infrastructure (runtime: Node.js with pnpm).
# Stacks live in Pulumi Cloud; `dev` is configured in Pulumi.dev.yaml.
name: ticketlite-infra
description: A minimal AWS TypeScript Pulumi program
runtime:
  name: nodejs
  options:
    packagemanager: pnpm
config:
  pulumi:tags:
    value:
      pulumi:template: aws-typescript
