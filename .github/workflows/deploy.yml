# The ONLY way TicketLite gets deployed: a push to main (a merged PR) or a manual run from main.
#   1. test + build   2. pulumi up   3. upload the web app to S3   4. invalidate CloudFront   5. smoke test
# Pull requests are checked by ci.yml instead (with a read-only preview).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  NODE_VERSION: "24"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC login to AWS
      contents: read
    # Never run two deploys (or a deploy and a destroy) at once: they would fight over the same stack.
    # cancel-in-progress: false lets a running deploy finish instead of killing it halfway.
    concurrency:
      group: pulumi-dev-stack
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Step 1: a last safety net (a push straight to main skips the PR checks), then the Lambda bundles.
      - run: pnpm typecheck && pnpm test
      - run: pnpm --filter "!@ticketlite/web" build

      # Step 2: the DEPLOY role. Its trust policy only accepts tokens from the main branch.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Step 3: apply the infrastructure. Non-interactive, the same as `pulumi up --yes`.
      # Every stack output (cloudFrontUrl, webBucketName, ...) becomes a step output.
      - id: pulumi
        uses: pulumi/actions@v7
        with:
          command: up
          stack-name: dev
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # Step 4: build the web app AFTER pulumi up, because later milestones bake stack outputs
      # (the AppSync URL, the Cognito domain) into it as NEXT_PUBLIC_* variables.
      # The AppSync URL and its PUBLIC API key are baked into the JavaScript (they are not secrets).
      - run: pnpm --filter @ticketlite/web build
        env:
          NEXT_PUBLIC_APPSYNC_URL: ${{ steps.pulumi.outputs.appsyncUrl }}
          NEXT_PUBLIC_APPSYNC_API_KEY: ${{ steps.pulumi.outputs.appsyncApiKey }}

      # Step 5: upload with the right cache headers. CONCEPT: cdn
      #  - _next/* files have a content hash in their name, so they can be cached for a year ("immutable").
      #  - Everything else (HTML) must be re-checked often: browsers revalidate every time (max-age=0),
      #    CloudFront keeps it 60s (s-maxage). --delete removes pages that no longer exist.
      - name: Upload web app to S3
        env:
          BUCKET: ${{ steps.pulumi.outputs.webBucketName }}
        run: |
          aws s3 sync web/out/_next "s3://$BUCKET/_next" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync web/out "s3://$BUCKET" --exclude "_next/*" --delete \
            --cache-control "public,max-age=0,s-maxage=60,must-revalidate"

      # Step 6: drop CloudFront's cached HTML so users get the new pages now, not within 60s.
      # "/*" counts as ONE invalidation path (the first 1,000 paths a month are free).
      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ steps.pulumi.outputs.distributionId }}"
          --paths "/*"

      # Step 7: post-deploy smoke test through CloudFront. M7 replaces it with Playwright.
      - name: Smoke test
        env:
          URL: ${{ steps.pulumi.outputs.cloudFrontUrl }}
        run: |
          curl -fsS "$URL/api/health"
          curl -fsS "$URL/" | grep -q "TicketLite"
