# Inserts the sample organizers and events into the deployed dev tables (scripts/seed.ts).
# Manual only. Safe to run again: the rows have fixed ids, so they are overwritten, not duplicated.
name: seed

on:
  workflow_dispatch:

permissions: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC login to AWS
      contents: read
    concurrency:
      group: seed-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The deploy role: it can write to the tables. Like deploy and destroy, it only works from main.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # No `command`: this only installs the Pulumi CLI, so the next step can read stack outputs.
      - uses: pulumi/actions@v7

      # Table names are generated by Pulumi (e.g. "events-1a2b3c4"), so we read them from the stack.
      - name: Seed
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: |
          EVENTS_TABLE="$(pulumi stack output eventsTableName --stack dev --cwd infra)"
          ORGANIZERS_TABLE="$(pulumi stack output organizersTableName --stack dev --cwd infra)"
          export EVENTS_TABLE ORGANIZERS_TABLE
          pnpm seed
